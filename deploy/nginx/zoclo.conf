# Zoclo API — Cloudflare → Nginx → Node (PM2, port 5000)
#
# THREAT MODEL FOR THIS FILE:
# 1. cf-connecting-ip is the rate-limit identity. Nginx must OVERWRITE
#    X-Forwarded-For (not append) so the app never sees a client-controlled
#    chain, and the origin must only accept traffic from Cloudflare IPs —
#    otherwise anyone hitting the VM directly can spoof cf-connecting-ip and
#    rotate their rate-limit identity (or poison other people's, DoS-style).
# 2. Socket.IO needs Upgrade/Connection hop headers AND long read/send
#    timeouts, or idle chat connections drop every ~60s (default) and the
#    client reconnect-storms.
#
# LOCK DOWN THE ORIGIN (do this first, on the VM):
#   Cloudflare IP ranges: https://www.cloudflare.com/ips/
#   ufw default deny incoming
#   ufw allow from <cf-range> to any port 443   (repeat for every range, 443+80)
#   ufw allow 22/tcp        # or your SSH port — ideally IP-restricted too
#   ufw enable

server {
    listen 80;
    server_name api.zoclo.example;   # ← your API domain

    # Cloudflare sends the real client IP in cf-connecting-ip. Derive XFF from
    # it (overwrite — NOT $proxy_add_x_forwarded_for, which APPENDS and leaves
    # the client-supplied chain in place for the app to misread).
    set $cf_ip $http_cf_connecting_ip;
    if ($cf_ip = "") {
        set $cf_ip $remote_addr;
    }

    # ── Socket.IO (websocket upgrade + long timeouts) ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cf_ip;
        proxy_set_header X-Forwarded-For $cf_ip;      # OVERWRITE, not append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── API ──
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cf_ip;
        proxy_set_header X-Forwarded-For $cf_ip;      # OVERWRITE, not append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;   # photos upload via API (5MB cap + overhead)
    }
}
