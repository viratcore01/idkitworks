name: keep-alive

# Zero-cost external keep-alive for the Render free Web Service.
# Pings the LIGHTWEIGHT /api/health endpoint (no DB calls) every 10 minutes
# so the instance never idles out (~15 min sleep window).
#
# Self-sufficient: no repository secret required. The production URL lives in
# the DEFAULT_API_URL variable below. A repo secret named RENDER_API_URL
# overrides it if you ever move hosts (Settings → Secrets and variables →
# Actions → Variables).
#
# Why 10 min: comfortably under Render's ~15 min idle cutoff, while using
# ~144 cheap GETs/day. Uses the no-DB endpoint so it never burns Supabase
# pool connections.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  DEFAULT_API_URL: https://idkitworks.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          URL="${{ vars.RENDER_API_URL || env.DEFAULT_API_URL }}/api/health"
          echo "Pinging $URL"
          # -f fails on HTTP >=400, --retry covers a cold-start race
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 "$URL"
